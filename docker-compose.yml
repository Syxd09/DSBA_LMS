version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: obe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obe_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-obe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obe_user} -d ${POSTGRES_DB:-obe_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build: ./backend
    container_name: obe-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-obe_user}:${POSTGRES_PASSWORD:-obe_secret_123}@db:5432/${POSTGRES_DB:-obe_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build: .
    container_name: obe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: obe-network
